# Redraws the profile images every six hours and whenever the profile or the renderer changes.
name: profile

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths: [profile.json, .wt/**, .github/workflows/profile.yml]

permissions:
  actions: write
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: node --test .wt/render.test.mjs
      - name: Render
        run: node .wt/render.mjs
        env:
          LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish images to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git add .
          git -c user.name=profile -c user.email=profile@users.noreply.github.com commit -qm "Render profile images"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
      - name: Commit the README when it changed
        run: |
          if git diff --quiet README.md && git ls-files --error-unmatch README.md >/dev/null 2>&1; then exit 0; fi
          git add README.md
          git -c user.name=profile -c user.email=profile@users.noreply.github.com commit -qm "Update profile README"
          git push -q
      # GitHub switches off scheduled runs after 60 days without repository activity.
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/profile.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
